name: Docker validation

on:
  push:
    branches: [Docker]
  pull_request:
    branches: [main, Docker]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Install test dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate application data and interactions
        run: |
          pnpm test
          pnpm test:dom

  container:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      MOE_MODEL_LAB_IMAGE: moe-model-lab:${{ github.sha }}
      MOE_MODEL_LAB_PORT: '18080'
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_REVISION: ${{ github.sha }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose configuration
        run: docker compose --file compose.yaml config --quiet
      - name: Check Dockerfile with BuildKit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          call: check
      - name: Build a native image archive in the cloud
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            moe-model-lab:${{ github.sha }}
            moe-model-lab:docker
          outputs: type=docker,dest=${{ runner.temp }}/moe-model-lab-${{ matrix.arch }}.tar
          push: false
          provenance: false
          cache-from: type=gha,scope=moe-model-lab-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=moe-model-lab-${{ matrix.arch }}
      - name: Load and test the exported image
        run: |
          docker load --input "${RUNNER_TEMP}/moe-model-lab-${EXPECTED_ARCH}.tar"
          bash scripts/test-container.sh
      - name: Record archive checksum and image identity
        working-directory: ${{ runner.temp }}
        run: |
          sha256sum "moe-model-lab-${EXPECTED_ARCH}.tar" > "moe-model-lab-${EXPECTED_ARCH}.tar.sha256"
          docker image inspect --format '{{.Id}} {{.Os}}/{{.Architecture}}' "$MOE_MODEL_LAB_IMAGE" > "image-info-${EXPECTED_ARCH}.txt"
          printf 'Source commit: %s\n' "$EXPECTED_REVISION" >> "image-info-${EXPECTED_ARCH}.txt"
      - name: Upload the tested image for deployment without local builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moe-model-lab-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/moe-model-lab-${{ matrix.arch }}.tar
            ${{ runner.temp }}/moe-model-lab-${{ matrix.arch }}.tar.sha256
            ${{ runner.temp }}/image-info-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7
